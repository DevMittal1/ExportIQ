[project]
name = "tradepilot"
version = "0.1.0"
description = "Agentic AI Import/Export Market Intelligence, Regulatory Compliance & Buyer Qualification Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "langgraph>=0.2.39",
    "langchain-core>=0.3.12",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "copilotkit>=0.1.96",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradepilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
